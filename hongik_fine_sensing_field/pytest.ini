# scan_stack 전체 트리를 한 번에 돌릴 때의 rootdir 고정용 (TRANSFER_TO_UBUNTU.md §2 의 명령).
# 이 파일이 없으면 pytest 가 첫 인자(vc3dz_driver/pyproject.toml)를 rootdir 로 잡고, rootdir 밖의 패키지별 tests/conftest.py
# 픽스처가 pytest 7.x 에서 전역으로 등록돼 마지막 것이 이기는 문제가 생긴다 (ROS Humble launch_testing 은 pytest 8 미지원).
# 패키지 단독 실행(cd scan_l0 && pytest)은 각 패키지의 pyproject.toml 설정을 그대로 쓴다.
[pytest]
testpaths = vc3dz_driver/tests scan_core/tests eoat_description/test scan_l0/tests hongik_scan_ros/test
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:vc3dz_driver.client
